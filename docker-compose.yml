version: "3.8"
services:
  frontend:
    build: ./front
    ports:
      - "8080:80"
    container_name: backfront-frontend
    restart: unless-stopped
    networks:
      - my-network

  backend:
    build: ./back
    ports:
      - "5000:5000"
    container_name: backfront-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
